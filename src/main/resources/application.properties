spring.application.name=nurshat-sagidullaeva-student-api
server.port=8080

# Database settings come from environment variables (see docker-compose.yml / .env).
# Inside Docker the host is the Compose service name "db", NOT localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Show the error message in JSON error responses (e.g. 404 Student not found)
server.error.include-message=always
